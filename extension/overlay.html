<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Focus Interrupted</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: linear-gradient(to bottom, #070b10, #17293f, #18273d);
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      text-align: center;
      overflow: hidden;
    }
    .emoji-img {
      width: 90px;
      margin-bottom: 25px;
    }
    h1 {
      font-size: 32px;
      font-weight: 500;
      margin: 0 0 25px 0;
      line-height: 1.3;
    }
    p.quote {
      font-size: 14px;
      color: #a0a0a0;
      font-weight: 400;
      max-width: 450px;
      margin: 0 auto 50px auto;
      line-height: 1.5;
    }
    .buttons-container {
      display: flex;
      gap: 15px;
      margin-top: 20px;
    }
    .btn {
      background: #ffffff;
      color: #000000;
      border: none;
      padding: 12px 30px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      transition: opacity 0.2s, transform 0.1s;
    }
    .btn:hover {
      opacity: 0.9;
      transform: scale(1.02);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.2);
      color: #ffffff;
      box-shadow: none;
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.3);
    }
  </style>
</head>
<body>
  <img src="icons/icon.png" alt="Opal" class="emoji-img">
  
  <h1>If not you, then who?<br>If not now, then when?</h1>
  
  <p class="quote">Every moment you waste on distractions is a moment stolen from your future success.</p>
  
  <div class="buttons-container">
    <button class="btn" id="btn-close">Close Tab</button>
    <button class="btn btn-secondary" id="btn-continue">Dismiss</button>
  </div>

  <script src="overlay.js"></script>
</body>
</html>
